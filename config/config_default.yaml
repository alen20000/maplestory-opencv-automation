
game:
  title: "新楓之谷：經典版"

player_setting:
  #喝水設定 key:按鍵 Vale:觸發血線，低於就喝對應藥水
  #常用按鍵 "delete"
  health_setting:
    light:
      key: null
      value: 80
    medium:
      key: null
      value: 50
    critical:
      key: "delete"
      value: 20
  auto_control_config:
    #人物的攻擊範圍(像素)
    attack_range: 100
image_processing:
  #TM_SQDIFF_NORMED（平方差正規化匹配）m/4
  max_threshold : 0.1
  #TM_CCOEFF_NORMED
  min_threshold : 0.6

game_bot:
  #roi範圍的位移量 ，設定好能減少運算
  roi_x_offset_l_width: 500
  roi_x_offset_r_width: 500
  roi_y_offset_t_high: 150
  roi_y_offset_b_high : 50

auto_control_config:
  #沒怪時左右爪怪
  search_interval: True
health_detector:
  #存放血條的是窗內位置 list[x1,y1,x2,y2]
  hp_lect: [504,755,608,766]
  lower_hp_color: [0, 200, 200]
  upper_hp_color: [5, 255, 255]
  # mp_lect:

keyboard:
  #QWERTY
  left: left
  right: right
  attack: ctrl
  pick_up: z



folder_path:
  template_nametag_path: img/nametag/example.png
  my_character_template_path: img/nametag/MyRoleNameTag.png
